

<!--

✅ border-width : 
    border   => border-width: 1px;
    border-<number> => border-width: <number>px;
    border-t => border-top-width: 1px;
    border-t-<number> => border-top-width: <number>px;
    border-r => border-right-width: 1px;
    border-r-<number> => border-right-width: <number>px;
    border-b => border-bottom-width: 1px;
    border-b-<number> => border-bottom-width: <number>px;
    border-l => border-left-width: 1px;
    border-l-<number> => border-left-width: <number>px;

✅ border-style :
    border-solid => border-style: solid;
    border-dashed => border-style: dashed;
    border-dotted => border-style: dotted;
    border-double => border-style: double;
    border-hidden => border-style: hidden;
    border-none => border-style: none;

✅ border-color :
    border-inherit => border-color: inherit;
    border-current => border-color: currentColor;
    border-transparent => border-color: transparent;
    border-black => border-color: black;
    border-white => border-color: white;
    border-<color> => border-color: <color>; 

✅ border-radius :
    rounded-[<value>] => border-radius: <value>;
    roundee-tl-[<value>] => border-top-left-radius: <value>;
    rounded-tr-[<value>] => border-top-right-radius: <value>;
    rounded-br-[<value>] => border-bottom-right-radius: <value>;
    rounded-lb-[<value>] => border-bottom-left-radius: <value>;

✅ border-collapse :
    border-collapse => border-collapse: collapse;
    border-separate => border-collapse: separate;

✅ border-spacing :
    border-spacing-[<value>] => border-spacing: <value>;
    border-spacing-x-[<value>] => border-spacing: <value> 0;
    border-spacing-y-[<value>] => border-spacing: 0 <value>; 

✅ outline-width :
    outline => outline-width: 1px;
    outline-<number> => outline-width: <number>px;
    outline-none => outline-width: 0;

✅ outline-style :
    outline-solid => outline-style: solid;
    outline-dashed => outline-style: dashed;
    outline-dotted => outline-style: dotted;
    outline-double => outline-style: double;
    outline-hidden => outline-style: hidden;
    outline-none => outline-style: none;

✅ outline-color :
    outline-inherit => outline-color: inherit;
    outline-current => outline-color: currentColor;
    outline-transparent => outline-color: transparent;
    outline-black => outline-color: black;
    outline-white => outline-color: white;
    outline-<color> => outline-color: <color>;

✅ outline-offset :
    outline-offset-<number> => outline-offset: 1px;
    outline-offset-[<value>] => outline-offset: <value>;

✅ box-shadow :
    shadow-none => box-shadow: none;
    shadow-current => box-shadow: currentColor;
    shadow-transparent => box-shadow: transparent;
    shadow-[<value>] => box-shadow: <value>;

    


-->
