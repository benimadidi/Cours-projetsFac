
<!-- 

    Les classes pour mettre des fonds et des couleurs avec Tailwind CSS

✅ color
    text-inherit  => color: inherit;
    text-current  => color: currentColor;
    text-transparent => color: transparent;
    text-black    => color: #000;
    text-white    => color: #fff;
    text-[<value>] => color: <value>;

✅ background-color
    bg-inherit     => background-color: inherit;
    bg-current     => background-color: currentColor;
    bg-transparent => background-color: transparent;
    bg-black       => background-color: #000;
    bg-white       => background-color: #fff;
    bg-[<value>]   => background-color: <value>;

✅ [CLASSE]-[COULEUR]-[NUANCE]

✅ background-image
    bg-none        => background-image: none;
    bg-[url(<value>)]  => background-image: url(<value>);

✅ background-position
    bg-top-left   => background-position: top left;
    bg-top        => background-position: top;
    bg-top-right  => background-position: top right;
    bg-left       => background-position: left;
    bg-center     => background-position: center;
    bg-right      => background-position: right;
    bg-bottom-left => background-position: bottom left;
    bg-bottom     => background-position: bottom;
    bg-bottom-right => background-position: bottom right;
    bg-[<value>]  => background-position: <value>;

✅ background-size
    bg-auto       => background-size: auto;
    bg-cover      => background-size: cover;
    bg-contain    => background-size: contain;
    bg-[<value>]  => background-size: <value>;

✅ background-repeat
    bg-repeat     => background-repeat: repeat;
    bg-no-repeat  => background-repeat: no-repeat;
    bg-repeat-x   => background-repeat: repeat-x;
    bg-repeat-y   => background-repeat: repeat-y;

✅ background-attachment
    bg-fixed      => background-attachment: fixed;
    bg-local      => background-attachment: local;
    bg-scroll     => background-attachment: scroll;

✅ background-origin
    bg-origin-border => background-origin: border-box;
    bg-origin-padding => background-origin: padding-box;
    bg-origin-content => background-origin: content-box;

✅ background-clip
    bg-clip-border => background-clip: border-box;
    bg-clip-padding => background-clip: padding-box;
    bg-clip-content => background-clip: content-box;
    bg-clip-text    => background-clip: text;

✅ accent-color
    accent-inherit => accent-color: inherit;
    accent-current => accent-color: currentColor;
    accent-transparent => accent-color: transparent;
    accent-black  => accent-color: #000;
    accent-white  => accent-color: #fff;
    accent-[<value>] => accent-color: <value>;

✅ backdrop-filter
    blur-[<value>] => backdrop-filter: blur(<value>);
    brightness-[<value>] => backdrop-filter: brightness(<value>);
    contrast-[<value>] => backdrop-filter: contrast(<value>);
    grayscale-[<value>] => backdrop-filter: grayscale(<value>);
    hue-rotate-[<value>] => backdrop-filter: hue-rotate(<value>);
    invert-[<value>] => backdrop-filter: invert(<value>);

✅ object-fit
    object-contain => object-fit: contain;
    object-cover   => object-fit: cover;
    object-fill    => object-fit: fill;
    object-none    => object-fit: none;
    object-scale-down => object-fit: scale-down;
-->
