
<!-- 

Les classes pour styliser le texte avec Tailwind CSS

✅ fontstyle :
    italic       => font-style: italic;
    no-italic    =>:font-style: normal;
        
✅ font-weight :
    font-thin       => font-weight: 100;
    font-extralight => font-weight: 200;
    font-light      => font-weight: 300;
    font-normal     => font-weight: 400;
    font-medium     => font-weight: 500;
    font-semibold   => font-weight: 600;
    font-bold       => font-weight: 700;
    font-extrabold  => font-weight: 800;
    font-black      => font-weight: 900;
    font-[<value>]  => font-weight: <value>;

✅line-height :
    leading-none       => line-height: 1;
    leading-[<value>] => line-height: <value>;

✅ font-family :
    font-sans       => font-family: sans-serif;
    font-serif      => font-family: serif;
    font-mono       => font-family: monospace;
    font-[<value>]  => font-family: <value>;

✅ text-deocration-line
    underline       => text-decoration-line: underline;
    overline        => text-decoration-line: overline;
    no-underline    => text-decoration-line: none;
    line-through    => text-decoration-line: line-through;
    no-line-through => text-decoration-line: none;

✅ text-decoration-color
    decoration-[<value>] => text-decoration-color: <value>;
    decoration-inherit => text-decoration-color: inherit;
    decoration-current => text-decoration-color: currentColor;

✅ text-decoration-style
    decoration-solid       => text-decoration-style: solid;
    decoration-double      => text-decoration-style: double;
    decoration-dotted      => text-decoration-style: dotted;
    decoration-dashed      => text-decoration-style: dashed;
    decoration-wavy        => text-decoration-style: wavy;
    decoration-[<value>]   => text-decoration-style: <value>;

✅ text-shadow
    text-shadow-[<value>] => text-shadow: <value>;

✅ text-align
    text-left    => text-align: left;
    text-right   => text-align: right;
    text-center  => text-align: center;
    text-justify => text-align: justify;

✅ letter-spacing
    tracking-[<value>] => letter-spacing: <value>;

✅ word-break : 
    break-normal => word-break: normal;
    break-all => word-break: break-all;

✅ vertical-align
    align-baseline => vertical-align: baseline;
    align-top      => vertical-align: top;
    align-middle   => vertical-align: middle;
    align-bottom   => vertical-align: bottom;
    align-text-top => vertical-align: text-top;
    align-text-bottom => vertical-align: text-bottom;
    align-sub     => vertical-align: sub;
    align-super   => vertical-align: super; 
    align-[<value>] => vertical-align: <value>;

-->
