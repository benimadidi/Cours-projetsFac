

<!--

✅ transform :
    scale-<number>  => scale: <number>;
    rotate-<number> => rotate: <number>deg;
    (-)translate-number => translate: <number>px;

    (-)translate-x-<number> => translateX: <number>px;
    (-)translate-y-<number> => translateY: <number>px;

Les transitions et animations en Tailwind CSS :
    ✅ transtion-duration: 
        duration-<number>  => transition-duration: <number>ms
    ✅ transtion-timing-function:
        ease-linear => transition-timing-function: linear
        ease-in     => transition-timing-function: ease-in 
        ease-out    => transition-timing-function: ease-out
        ease-in-out => transition-timing-function: ease-in-out
    ✅ transtion-delay:
        delay-<number> => transition-delay: <number>ms
 
-->
