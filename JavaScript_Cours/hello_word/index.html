<!--
Integrer du Javascript dans un fichier HTML
    - onclick : attribut HTML
    - <script></script> : balise HTML
        Le mettre en bas du body pour ne pas 
    - Par un fichier externe
        L'inclure avec la balise script avec le attribut src
            Ex : <script src="script.js"></script>
-->
<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Ma page web</title>
    </head>
    <body>
        <h1>Formation JavaScript</h1>

        <script src="script.js"></script>
    </body>
</html>
