<!-- 
Les deux catégories de balises sont : 
    1. Les balises inline (en ligne) :
        ✅ Elles n'occupent que l'espace nécessaire à leur contenu.
        ✅ Elles ne commencent pas sur une nouvelle ligne.
        ✅ Exemples : <span>, <a>, <strong>, <em>, <img>, etc.

    2. Les balises block (en bloc) :
        ✅ Elles occupent toute la largeur disponible (par défaut).
        ✅ Elles commencent toujours sur une nouvelle ligne.
        ✅ Exemples : <div>, <p>, <h1> à <h6>, <section>, <article>, etc.
-->

<!-- Exemple d'utilisation de balises -->
<balise>du texte</balise> 
<baliseorpheline />

<!-- Faire de l'imbrication de balises -->
<!-- 
L'imbrication consiste à placer une balise à l'intérieur d'une autre balise.
Il est important de respecter l'ordre d'ouverture et de fermeture des balises.
-->
<baliseA>
    Bonjour tout <baliseB>le monde</baliseB>
</baliseA>

<!-- Exemple d'imbrication correcte -->
<p>
    Ceci est un paragraphe avec un <strong>texte en gras</strong> et un <em>texte en italique</em>.
</p>
