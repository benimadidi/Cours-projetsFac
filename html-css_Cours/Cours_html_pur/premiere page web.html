<!-- 
le charset dans la balise meta permet de définir un type d'encodage.
-->

<!DOCTYPE html>    <!-- Définit le type de document comme étant HTML5 -->
<html>             <!-- Balise racine qui contient tout le contenu de la page -->
    <head>         <!-- Section contenant les métadonnées de la page (non affichées à l'écran) -->
        <meta charset="utf-8"> <!-- Définit l'encodage des caractères en UTF-8 -->
        <title>Ma première page web !</title> <!-- Définit le titre de la page affiché dans l'onglet du navigateur -->
    </head>
    <body>         <!-- Section contenant le contenu visible de la page -->
        <p>mon premier paragraphe</p> <!-- Définit un paragraphe de texte -->
    </body>
</html>
